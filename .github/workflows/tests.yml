name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Linux plus Windows — the primary user runs PartsMatcher on Windows.
        os: [ubuntu-latest, windows-latest]
        # Oldest supported (pyproject requires-python >=3.9) and current.
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the test suite
        run: python -m unittest
      - name: Smoke-test the CLI against the bundled samples
        run: python -m partsmatcher
